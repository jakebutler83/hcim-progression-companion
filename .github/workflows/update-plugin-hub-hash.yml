name: Submit Plugin Hub release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      companion_ref:
        description: Companion branch, tag, or commit to publish
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: hcim-progression-plugin-hub-release
  cancel-in-progress: false

jobs:
  submit-plugin-hub-release:
    if: github.repository == 'jakebutler83/hcim-progression-companion'
    runs-on: ubuntu-latest
    env:
      PLUGIN_HUB_TOKEN: ${{ secrets.PLUGIN_HUB_TOKEN }}
      PLUGIN_HUB_BRANCH: update-hcim-progression-companion
      PLUGIN_MANIFEST: plugins/hcim-progression-companion
    steps:
      - name: Check out companion release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.companion_ref || github.event.release.tag_name || github.sha }}
          path: companion

      - name: Resolve companion commit
        id: companion
        working-directory: companion
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Explain missing one-time setup
        if: env.PLUGIN_HUB_TOKEN == ''
        run: |
          echo "PLUGIN_HUB_TOKEN is not configured; the companion release was not submitted to Plugin Hub."
          echo "Add a fine-grained token with Contents: Read and write access to jakebutler83/plugin-hub."
          echo "Repository secret name: PLUGIN_HUB_TOKEN"
          echo "## Plugin Hub release submission skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the repository secret PLUGIN_HUB_TOKEN, then run this workflow manually." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out public Plugin Hub fork
        if: env.PLUGIN_HUB_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: jakebutler83/plugin-hub
          ref: master
          path: plugin-hub
          persist-credentials: false
          fetch-depth: 0

      - name: Update companion commit
        if: env.PLUGIN_HUB_TOKEN != ''
        id: manifest
        working-directory: plugin-hub
        env:
          COMPANION_SHA: ${{ steps.companion.outputs.sha }}
        run: |
          set -euo pipefail
          test -f "$PLUGIN_MANIFEST"
          grep -Fxq "repository=https://github.com/jakebutler83/hcim-progression-companion.git" "$PLUGIN_MANIFEST"
          sed -i -E "s/^commit=[0-9a-f]{40}$/commit=${COMPANION_SHA}/" "$PLUGIN_MANIFEST"
          grep -Fxq "commit=${COMPANION_SHA}" "$PLUGIN_MANIFEST"
          if git diff --quiet -- "$PLUGIN_MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Plugin Hub already points at ${COMPANION_SHA}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push public update branch
        if: env.PLUGIN_HUB_TOKEN != '' && steps.manifest.outputs.changed == 'true'
        working-directory: plugin-hub
        env:
          COMPANION_SHA: ${{ steps.companion.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PLUGIN_HUB_BRANCH"
          git add "$PLUGIN_MANIFEST"
          git commit -m "Update HCIM Progression Companion to ${COMPANION_SHA:0:12}"
          git remote set-url origin "https://x-access-token:${PLUGIN_HUB_TOKEN}@github.com/jakebutler83/plugin-hub.git"
          git push --force origin "HEAD:${PLUGIN_HUB_BRANCH}"

      - name: Open or refresh RuneLite review pull request
        if: env.PLUGIN_HUB_TOKEN != '' && steps.manifest.outputs.changed == 'true'
        working-directory: plugin-hub
        env:
          GH_TOKEN: ${{ env.PLUGIN_HUB_TOKEN }}
          COMPANION_SHA: ${{ steps.companion.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_REF="jakebutler83:${PLUGIN_HUB_BRANCH}"
          PR_NUMBER="$(gh pr list --repo runelite/plugin-hub --state open --head "$HEAD_REF" --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            echo "Updated existing Plugin Hub PR #${PR_NUMBER}."
          else
            if gh pr create \
              --repo runelite/plugin-hub \
              --base master \
              --head "$HEAD_REF" \
              --title "Update HCIM Progression Companion" \
              --body "Updates HCIM Progression Companion to [${COMPANION_SHA}](https://github.com/jakebutler83/hcim-progression-companion/commit/${COMPANION_SHA})."; then
              echo "Opened a new RuneLite review pull request."
            else
              COMPARE_URL="https://github.com/runelite/plugin-hub/compare/master...jakebutler83:${PLUGIN_HUB_BRANCH}?expand=1"
              echo "The update branch was pushed, but this token could not open the upstream PR automatically."
              echo "Open ${COMPARE_URL} to submit it for review."
              echo "Manual PR link: ${COMPARE_URL}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Summarize submission
        if: env.PLUGIN_HUB_TOKEN != ''
        env:
          COMPANION_SHA: ${{ steps.companion.outputs.sha }}
        run: |
          echo "## Plugin Hub release submission" >> "$GITHUB_STEP_SUMMARY"
          echo "Companion commit: \`${COMPANION_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.manifest.outputs.changed }}" = "true" ]; then
            echo "A public Plugin Hub update branch and review pull request were created or refreshed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Plugin Hub already references this exact companion commit." >> "$GITHUB_STEP_SUMMARY"
          fi
